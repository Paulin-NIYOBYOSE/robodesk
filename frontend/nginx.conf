server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Matches the API's MAX_IMPORT_BYTES so oversized CSVs are refused at the edge.
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s; # large imports
    }

    # Caching uses `expires`, not add_header: an add_header inside a location
    # would stop the security headers above from being inherited.

    # Hashed assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths serve the app shell (always revalidated).
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
